# =============================================================================
# ray-serve/service.yaml — Exposes Ray Serve's OpenAI-compatible endpoint
#
# All external traffic to a Ray Serve app enters through the Ray head pod's
# HTTP proxy (port 8000), which routes internally to the GPU worker running
# the actual model. So this LoadBalancer selects the HEAD pod, not the worker.
#
# Same pattern as kubernetes/vllm/service.yaml — restricted to allowed_admin_cidr,
# substituted by scripts/deploy-all.sh the same way.
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: ray-serve-llm
  namespace: ray-serve
  labels:
    app.kubernetes.io/part-of: akai-inference
  annotations:
    service.beta.kubernetes.io/linode-loadbalancer-throttle: "15"
    service.beta.kubernetes.io/linode-loadbalancer-proxy-protocol: "none"
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - "ALLOWED_ADMIN_CIDR_PLACEHOLDER"
  selector:
    app.kubernetes.io/part-of: akai-inference
    ray.io/node-type: head
  ports:
    - name: api
      port: 8000
      targetPort: 8000
      protocol: TCP
  externalTrafficPolicy: Local

---
# Ray dashboard — separate LoadBalancer, admin-only, port 8265.
apiVersion: v1
kind: Service
metadata:
  name: ray-dashboard
  namespace: ray-serve
  labels:
    app.kubernetes.io/part-of: akai-inference
  annotations:
    service.beta.kubernetes.io/linode-loadbalancer-throttle: "10"
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - "ALLOWED_ADMIN_CIDR_PLACEHOLDER"
  selector:
    app.kubernetes.io/part-of: akai-inference
    ray.io/node-type: head
  ports:
    - name: dashboard
      port: 8265
      targetPort: 8265
      protocol: TCP
  externalTrafficPolicy: Local
